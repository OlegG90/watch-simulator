name: deploy to github pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions for deploying to Pages through GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; new pushes do not cancel a release already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # base = /<repo>/ , because a project site lives under that subpath.
      - run: npx vite build --base=/watch-simulator/
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
